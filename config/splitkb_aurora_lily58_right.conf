# Peripheral half: PIM447 trackball driver, events forwarded to the central
CONFIG_ZMK_POINTING=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_PIM447=y

# Cap each I2C transfer at 10 ms (default 500 ms). The driver polls on the system
# work queue shared with key scanning, so a failing bus must not stall keystrokes.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=10
